name: FHIR-SpecGuard-LLM CI & Conformance Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode (PEP 621 pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Core XSLT AST & HIPAA Sanitizer Tests (7 tests)
        run: python3 test_specguard_xslt_auditor.py -v

      - name: Run 9-Tab Requirement Workbook & CI/CD Drift Tests (5 tests)
        run: python3 specguard_workbook_cli.py -v

      - name: Run CMS-0057-F FHIR IG Conformance Tests (CARIN BB, PDex, PAS - 6 tests)
        run: python3 specguard_cms0057_validator.py -v
